name: release

# A pushed v* tag first opens a draft release named after the version (the
# notes are written by hand while it builds), then builds Cement.cia and
# Cement.3dsx into it with their signed checksums, and makes it public once
# all of them are on it.
on:
  push:
    tags: ["v*"]

permissions: {}

defaults:
  run:
    shell: bash

env:
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against VERSION
        id: version
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME but VERSION is $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # a release made by hand for this tag keeps its notes
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "the release for $GITHUB_REF_NAME exists already"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$VERSION" --notes "" --verify-tag
          fi

  build:
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      CARGO_3DS: 0.1.5
      MAKEROM_URL: https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
      MAKEROM_SHA256: 287b809dec064e0ad597e3d272c49ecb7eed41693d5ee6fef9d8a8aa24c2497e
      BANNERTOOL_URL: https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
      BANNERTOOL_SHA256: 69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust and cargo-3ds
        run: |
          # the nightly the Makefile builds with
          nightly=$(sed -n 's/^NIGHTLY[[:space:]]*:=[[:space:]]*//p' Makefile)
          [ -n "$nightly" ] || { echo "no NIGHTLY in the Makefile" >&2; exit 1; }
          rustup toolchain install "$nightly" --profile minimal -c rust-src
          cargo install --locked cargo-3ds --version "$CARGO_3DS"

      - name: Install libclang, makerom and bannertool
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libclang-dev
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools/bin"
          curl -fsSLo "$tools/makerom.zip" "$MAKEROM_URL"
          curl -fsSLo "$tools/bannertool.zip" "$BANNERTOOL_URL"
          echo "$MAKEROM_SHA256  $tools/makerom.zip" | sha256sum -c
          echo "$BANNERTOOL_SHA256  $tools/bannertool.zip" | sha256sum -c
          unzip -q -j "$tools/makerom.zip" makerom -d "$tools/bin"
          unzip -q -j "$tools/bannertool.zip" linux-x86_64/bannertool -d "$tools/bin"
          chmod +x "$tools/bin/makerom" "$tools/bin/bannertool"
          echo "$tools/bin" >> "$GITHUB_PATH"

      - name: Build
        run: ./build.sh | tee "$RUNNER_TEMP/build.log"

      - name: Check the version
        run: |
          # the version shown (no -dev suffix) and the CIA's title version, both from VERSION
          grep -qx "built \.\.\. Cement.cia v$VERSION" "$RUNNER_TEMP/build.log" || { echo "the build isn't v$VERSION" >&2; exit 1; }
          u32() { od -An -tu4 -j "$1" -N4 Cement.cia | tr -d ' \n'; }
          align() { echo $(( ($1 + 63) / 64 * 64 )); }
          tmd=$(( $(align "$(u32 0)") + $(align "$(u32 8)") + $(align "$(u32 12)") ))
          set -- $(od -An -tu1 -j $((tmd + 0x140 + 0x9C)) -N2 Cement.cia)
          v=$(( ($1 << 8) | $2 ))
          title="$((v >> 10)).$(((v >> 4) & 63)).$((v & 15))"
          [ "$title" = "$VERSION" ] || { echo "CIA title version $title, not $VERSION" >&2; exit 1; }

      - name: Sign the checksums
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          # the public half Baguette checks the signature with
          PUBLIC_KEY: 18d787177065e96304292b13b2ee55dcc840912731f0caad59bbb60ce3320b67
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "the RELEASE_SIGNING_KEY secret is missing" >&2; exit 1; }
          key="$RUNNER_TEMP/key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          # a wrong key in the secret fails here, not in Baguette
          public=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          [ "$public" = "$PUBLIC_KEY" ] || { echo "the signing key doesn't match the public key" >&2; exit 1; }
          sha256sum Cement.cia Cement.3dsx > SHA256SUMS
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          [ "$(wc -c < SHA256SUMS.sig)" -eq 64 ] || { echo "the signature isn't 64 bytes" >&2; exit 1; }
          cat SHA256SUMS

      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Cement.cia Cement.3dsx SHA256SUMS SHA256SUMS.sig --clobber

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish once all files are on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for f in Cement.cia Cement.3dsx SHA256SUMS SHA256SUMS.sig; do
            grep -qx "$f" <<< "$assets" || { echo "$f is missing from the release" >&2; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false
